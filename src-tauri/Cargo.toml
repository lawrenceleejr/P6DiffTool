[package]
name = "p6-diff-tool"
version = "0.1.0"
description = "Cross-platform desktop app that diffs two Primavera P6 XER files."
edition = "2021"
rust-version = "1.77"

[lib]
name = "p6_diff_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
